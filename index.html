
<script>
let currentLanguage = "fa";
let activeBookCategory = "all";

function normalizeText(text) {
  return (text || "")
    .toLowerCase()
    .replace(/ي/g, "ی")
    .replace(/ك/g, "ک")
    .replace(/‌/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function changeLanguage() {
  currentLanguage = currentLanguage === "fa" ? "en" : "fa";

  document.documentElement.lang = currentLanguage;
  document.documentElement.dir =
    currentLanguage === "fa" ? "rtl" : "ltr";

  document.querySelectorAll("[data-fa][data-en]").forEach(el => {
    el.textContent = currentLanguage === "fa"
      ? el.getAttribute("data-fa")
      : el.getAttribute("data-en");
  });

  const input = document.getElementById("searchInput");
  if (input) {
    input.placeholder = currentLanguage === "fa"
      ? "نام کتاب یا موضوع مورد نظر را جست‌وجو کنید..."
      : "Search for a book or topic...";
  }

  const button = document.getElementById("langButton");
  if (button) {
    button.textContent =
      currentLanguage === "fa" ? "English" : "فارسی";
  }
}

function searchBooks() {
  applyBookFilters();
}

function filterCategory(category) {
  activeBookCategory = category;
  document.getElementById("searchInput").value = "";
  applyBookFilters();
  document.getElementById("books").scrollIntoView({
    behavior: "smooth"
  });
}

function showAllBooks() {
  activeBookCategory = "all";
  document.getElementById("searchInput").value = "";
  applyBookFilters();
  document.getElementById("books").scrollIntoView({
    behavior: "smooth"
  });
}

function applyBookFilters() {
  const input = document.getElementById("searchInput");
  const query = normalizeText(input ? input.value : "");

  const books = document.querySelectorAll("#bookList .book");
  let visibleCount = 0;

  books.forEach(book => {
    const content = normalizeText(
      book.innerText + " " +
      (book.getAttribute("data-search") || "")
    );

    const category = book.getAttribute("data-category");

    const visible =
      (activeBookCategory === "all" ||
       category === activeBookCategory) &&
      content.includes(query);

    book.style.display = visible ? "" : "none";
    if (visible) visibleCount++;
  });

  const noResult = document.getElementById("noResult");
  if (noResult) {
    noResult.style.display =
      visibleCount === 0 ? "block" : "none";
  }
}

function toggleFavorite(button) {
  const book = button.closest(".book");
  if (!book) return;

  const title = book.querySelector("h3").textContent.trim();
  const description =
    book.querySelector("p")?.textContent.trim() || "";

  const cover =
    book.querySelector(".book-cover img")?.getAttribute("src") || "";

  const link =
    book.querySelector(".book-link")?.getAttribute("href") || "";

  let favorites = JSON.parse(
    localStorage.getItem("ehsanFavorites") || "[]"
  );

  const index = favorites.findIndex(item =>
    (typeof item === "string" ? item : item.title) === title
  );

  if (index === -1) {
    favorites.push({ title, description, cover, link });
  } else {
    favorites.splice(index, 1);
  }

  localStorage.setItem(
    "ehsanFavorites",
    JSON.stringify(favorites)
  );

  showFavorites();
}

function showFavorites() {
  const favorites = JSON.parse(
    localStorage.getItem("ehsanFavorites") || "[]"
  );

  const container = document.getElementById("favoriteBooks");
  const count = document.getElementById("favoriteCount");

  if (!container) return;

  if (count) {
    count.textContent =
      "تعداد کتاب‌های ذخیره‌شده: " + favorites.length;
  }

  document.querySelectorAll("#bookList .book").forEach(book => {
    const title = book.querySelector("h3")?.textContent.trim();
    const button = book.querySelector(".favorite-btn");

    if (!button) return;

    const saved = favorites.some(item =>
      (typeof item === "string" ? item : item.title) === title
    );

    button.textContent = saved
      ? "♥ افزوده شد"
      : "♡ افزودن به علاقه‌مندی‌ها";
  });

  container.innerHTML = "";

  if (!favorites.length) {
    container.textContent = "هنوز کتابی ذخیره نکرده‌اید.";
    return;
  }

  favorites.forEach(savedBook => {
    const book = typeof savedBook === "string"
      ? {
          title: savedBook,
          description: "",
          cover: "",
          link: "#"
        }
      : savedBook;

    const item = document.createElement("div");
    item.style.cssText =
      "padding:15px;margin:12px 0;border:1px solid #d6c9a5;border-radius:12px;display:flex;gap:15px;align-items:center;";

    if (book.cover) {
      const img = document.createElement("img");
      img.src = book.cover;
      img.alt = book.title;
      img.style.cssText =
        "width:85px;height:115px;object-fit:contain;";
      item.appendChild(img);
    }

    const details = document.createElement("div");

    const name = document.createElement("h3");
    name.textContent = book.title;

    const description = document.createElement("p");
    description.textContent = book.description || "";

    const read = document.createElement("a");
    read.textContent = "مطالعه کتاب";
    read.href = book.link || "#";

    const remove = document.createElement("button");
    remove.textContent = "حذف از کتابخانه";

    remove.onclick = function() {
      let current = JSON.parse(
        localStorage.getItem("ehsanFavorites") || "[]"
      );

      current = current.filter(entry =>
        (typeof entry === "string" ? entry : entry.title)
        !== book.title
      );

      localStorage.setItem(
        "ehsanFavorites",
        JSON.stringify(current)
      );

      showFavorites();
    };

    details.append(name, description, read, remove);
    item.appendChild(details);
    container.appendChild(item);
  });
}

document.addEventListener("DOMContentLoaded", function() {

  document.querySelectorAll("#bookList .book").forEach(book => {

    if (!book.querySelector(".favorite-btn")) {
      const button = document.createElement("button");

      button.className = "favorite-btn";
      button.type = "button";
      button.textContent = "♡ افزودن به علاقه‌مندی‌ها";

      button.onclick = function() {
        toggleFavorite(button);
      };

      book.appendChild(button);
    }

  });

  showFavorites();
});
</script>
</body>
</html>
