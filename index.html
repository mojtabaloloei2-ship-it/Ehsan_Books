
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1830">
<title>AI Book Guide | EHSAN BOOKS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#17243a;line-height:2}
header{background:#0b1830;color:white;padding:20px 7%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-size:23px;font-weight:bold;color:white}
.logo span{color:#36c6bd}
nav a{color:white;text-decoration:none;margin:0 9px;font-size:14px}
button,select{font-family:inherit}
#lang{background:#36c6bd;color:#0b1830;border:0;padding:9px 16px;border-radius:8px;font-weight:bold;cursor:pointer}
.hero{background:linear-gradient(135deg,#0b1830,#193b60);color:white;padding:45px 20px;text-align:center}
.hero h1{font-size:28px;margin:0 0 12px}
.hero p{max-width:700px;margin:auto;color:#e1eaf5}
main{max-width:850px;margin:30px auto;padding:20px}
.card{background:white;padding:28px;border-radius:14px;box-shadow:0 5px 25px #15233a12;margin-bottom:22px}
h2{color:#102746;font-size:21px;margin-top:0}
label{display:block;font-weight:bold;margin:15px 0 7px}
select{width:100%;padding:13px;border:1px solid #ccd5e1;border-radius:8px;background:white;color:#17243a}
.action{background:#36c6bd;color:#0b1830;border:0;padding:12px 22px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:20px;width:100%;font-size:15px}
#result{display:none;margin-top:22px;padding:18px;background:#edf9f8;border-right:4px solid #36c6bd;border-radius:8px}
#result h3{color:#102746}
.book{background:white;padding:12px;border-radius:8px;margin:10px 0}
footer{text-align:center;background:#0b1830;color:#dce5f2;padding:22px;margin-top:40px}
footer a{color:#36c6bd;text-decoration:none;margin:0 8px}
@media(max-width:600px){header{padding:16px}.hero h1{font-size:23px}.card{padding:20px}}
</style>
</head>
<body>

<header>
<div class="logo">EHSAN <span>BOOKS</span></div>
<nav>
<a href="index.html" data-fa="خانه" data-en="Home">خانه</a>
<a href="about.html" data-fa="درباره ما" data-en="About Us">درباره ما</a>
<a href="contact.html" data-fa="تماس با ما" data-en="Contact">تماس با ما</a>
</nav>
<button id="lang" onclick="changeLanguage()">English</button>
</header>

<section class="hero">
<h1 data-fa="راهنمای هوشمند کتاب‌ها" data-en="AI Book Guide">راهنمای هوشمند کتاب‌ها</h1>
<p data-fa="کتاب مناسب خود را پیدا کن و مسیر یادگیری‌ات را با راهنمای EHSAN BOOKS آغاز کن."
data-en="Discover books that match your interests and begin your learning journey with EHSAN BOOKS.">
کتاب مناسب خود را پیدا کن و مسیر یادگیری‌ات را با راهنمای EHSAN BOOKS آغاز کن.
</p>
</section>

<main>
<section class="card">
<h2 data-fa="چه چیزی می‌خواهی یاد بگیری؟" data-en="What would you like to learn?">چه چیزی می‌خواهی یاد بگیری؟</h2>

<label for="topic" data-fa="موضوع مورد علاقه" data-en="Your Topic">موضوع مورد علاقه</label>
<select id="topic">
<option value="business" data-fa="کسب‌وکار و مدیریت" data-en="Business and Management">کسب‌وکار و مدیریت</option>
<option value="success" data-fa="موفقیت و توسعه فردی" data-en="Success and Personal Development">موفقیت و توسعه فردی</option>
<option value="psychology" data-fa="روان‌شناسی و ذهن" data-en="Psychology and Mind">روان‌شناسی و ذهن</option>
<option value="finance" data-fa="مالی و سرمایه‌گذاری" data-en="Finance and Investing">مالی و سرمایه‌گذاری</option>
<option value="technology" data-fa="فناوری و هوش مصنوعی" data-en="Technology and AI">فناوری و هوش مصنوعی</option>
<option value="science" data-fa="علم و دانش عمومی" data-en="Science and General Knowledge">علم و دانش عمومی</option>
</select>

<label for="level" data-fa="سطح مطالعه" data-en="Reading Level">سطح مطالعه</label>
<select id="level">
<option value="beginner" data-fa="مبتدی" data-en="Beginner">مبتدی</option>
<option value="intermediate" data-fa="متوسط" data-en="Intermediate">متوسط</option>
<option value="advanced" data-fa="پیشرفته" data-en="Advanced">پیشرفته</option>
</select>

<button class="action" onclick="recommend()" data-fa="پیشنهاد کتاب به من" data-en="Recommend Books">پیشنهاد کتاب به من</button>

<div id="result" aria-live="polite"></div>
</section>
</main>

<footer>
<p>© 2026 EHSAN BOOKS</p>
<a href="copyright.html" data-fa="حقوق نشر" data-en="Copyright">حقوق نشر</a>
<a href="terms.html" data-fa="شرایط استفاده" data-en="Terms">شرایط استفاده</a>
</footer>

<script>
let language="fa";

const books={
business:{
fa:["مدیر یک دقیقه‌ای","از خوب به عالی","استراتژی اقیانوس آبی"],
en:["The One Minute Manager","Good to Great","Blue Ocean Strategy"]
},
success:{
fa:["قدرت عادت","اثر مرکب","هفت عادت مردمان مؤثر"],
en:["The Power of Habit","The Compound Effect","The 7 Habits of Highly Effective People"]
},
psychology:{
fa:["تفکر سریع و کند","هوش هیجانی","انسان در جستجوی معنا"],
en:["Thinking, Fast and Slow","Emotional Intelligence","Man's Search for Meaning"]
},
finance:{
fa:["پدر پولدار پدر بی‌پول","روان‌شناسی پول","سرمایه‌گذار هوشمند"],
en:["Rich Dad Poor Dad","The Psychology of Money","The Intelligent Investor"]
},
technology:{
fa:["زندگی ۳.۰","هوش مصنوعی: رویکردی نوین","انسان و ماشین"],
en:["Life 3.0","Artificial Intelligence: A Modern Approach","Human Compatible"]
},
science:{
fa:["جهان در پوست گردو","تاریخچه مختصر زمان","جهان‌های موازی"],
en:["The Universe in a Nutshell","A Brief History of Time","Parallel Worlds"]
}
};

function recommend(){
const topic=document.getElementById("topic").value;
const level=document.getElementById("level").value;
const list=books[topic][language];
const result=document.getElementById("result");

const titles=language==="fa"
?["پیشنهادهای کتاب برای شما","مسیر پیشنهادی مطالعه","سطح انتخاب‌شده"]
:["Recommended Books for You","Suggested Reading Path","Selected Level"];

const levels={
beginner:language==="fa"?"مبتدی":"Beginner",
intermediate:language==="fa"?"متوسط":"Intermediate",
advanced:language==="fa"?"پیشرفته":"Advanced"
};

result.style.display="block";
result.innerHTML="<h3>"+titles[0]+"</h3>"+
list.map((book,i)=>"<div class='book'>"+(i+1)+". "+book+"</div>").join("")+
"<h3>"+titles[1]+"</h3>"+
(language==="fa"
?"از کتاب اول شروع کن، نکات مهم را یادداشت کن و سپس سراغ کتاب بعدی برو."
:"Start with the first book, take notes on key ideas, and then move to the next book.")+
"<p><strong>"+titles[2]+": </strong>"+levels[level]+"</p>";
}

function changeLanguage(){
language=language==="fa"?"en":"fa";
document.documentElement.lang=language;
document.documentElement.dir=language==="fa"?"rtl":"ltr";

document.querySelectorAll("[data-fa]").forEach(el=>{
el.textContent=el.getAttribute("data-"+language);
});

document.getElementById("lang").textContent=language==="fa"?"English":"فارسی";
}
</script>
</body>
</html>
