<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1830">
<title>حساب کاربری | EHSAN BOOKS</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#0b1830;
color:#fff;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px
}
.container{
width:100%;max-width:430px;
background:#132642;
border:1px solid #244461;
border-radius:18px;
padding:28px;
box-shadow:0 15px 40px #0005
}
.logo{text-align:center;color:#48d6c5;font-size:25px;font-weight:bold}
.subtitle{text-align:center;color:#d9c58a;margin:12px 0 25px}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tabs button{
flex:1;padding:12px;border:1px solid #426079;
border-radius:9px;background:transparent;
color:white;font-size:15px
}
.tabs button.active{background:#20b9ad;color:#092039}
label{display:block;margin:14px 0 7px}
input{
width:100%;padding:13px;border-radius:9px;
border:1px solid #456078;background:#0b1830;
color:white;font-size:15px
}
.submit{
width:100%;padding:14px;margin-top:22px;
border:0;border-radius:9px;
background:#20b9ad;color:#062039;
font-weight:bold;font-size:16px
}
.note{text-align:center;color:#b8c7d8;font-size:12px;line-height:2;margin-top:20px}
a{color:#48d6c5;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<div class="logo">EHSAN BOOKS</div>
<div class="subtitle">حساب کاربری | دانش برای جهانی بهتر</div>

<div class="tabs">
<button id="registerTab" class="active" type="button" onclick="showForm('register')">ثبت‌نام</button>
<button id="loginTab" type="button" onclick="showForm('login')">ورود</button>
</div>

<form id="accountForm" onsubmit="demoSubmit(event)">
<div id="nameField">
<label>نام و نام خانوادگی</label>
<input type="text" id="name" placeholder="نام کامل شما" required>
</div>

<label>ایمیل</label>
<input type="email" id="email" placeholder="example@email.com" required>

<label>رمز عبور</label>
<input type="password" id="password" placeholder="حداقل ۸ کاراکتر" minlength="8" required>

<button class="submit" id="submitButton" type="submit">ایجاد حساب کاربری</button>
</form>

<div id="message" class="note">
این صفحه در مرحله آزمایشی طراحی است.
</div>
<div class="note">
<a href="index.html">بازگشت به کتابخانه EHSAN BOOKS</a>
</div>
</div>

<script>
let currentMode="register";

function showForm(mode){
currentMode=mode;
document.getElementById("nameField").style.display=
mode==="register"?"block":"none";
document.getElementById("name").required=mode==="register";
document.getElementById("registerTab").classList.toggle("active",mode==="register");
document.getElementById("loginTab").classList.toggle("active",mode==="login");
document.getElementById("submitButton").textContent=
mode==="register"?"ایجاد حساب کاربری":"ورود به حساب";
document.getElementById("message").textContent=
mode==="register"?"ثبت‌نام در مرحله آزمایشی است.":"ورود در مرحله آزمایشی است.";
}

function demoSubmit(event){
event.preventDefault();
document.getElementById("message").textContent=
"این فرم هنوز به سیستم ثبت‌نام متصل نشده است. لطفاً منتظر تکمیل اتصال بمانید.";
}
</script>
</body>
</html>
